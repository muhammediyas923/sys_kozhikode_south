<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Offline | SYS Kozhikode South</title>
  <meta name="theme-color" content="#14533e">
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:system-ui, sans-serif; background:#f6f8fa; color:#111; }
    .offline-shell { max-width:520px; width:100%; padding:32px; text-align:center; background:white; border-radius:18px; box-shadow:0 22px 60px rgba(0,0,0,0.12); }
    h1 { margin:0 0 16px; font-size:2rem; color:#14533e; }
    p { margin:0 0 24px; line-height:1.7; color:#3c3c3c; }
    a { display:inline-flex; align-items:center; justify-content:center; gap:0.5rem; padding:0.9rem 1.4rem; color:white; background:#14533e; border-radius:999px; text-decoration:none; font-weight:600; }
    .offline-icon { font-size:3rem; margin-bottom:18px; color:#14533e; }
  </style>
</head>
<body>
  <div class="offline-shell">
    <div class="offline-icon">📴</div>
    <h1>You're offline</h1>
    <p>The SYS Kozhikode South app is not connected to the internet right now. You can still use cached content while offline, or reconnect to continue.
    </p>
    <a href="/">Go back home</a>
  </div>

</html>
